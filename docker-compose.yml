services:
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # Host port 80 is very commonly already taken on Windows (IIS /
      # World Wide Web Publishing Service, Skype, VMware NAT, etc.), which
      # shows up as ERR_CONNECTION_RESET rather than a Docker startup
      # error, so publish on an uncommon port instead.
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - aap

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aap}
      POSTGRES_USER: ${POSTGRES_USER:-aap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aap}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - aap
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aap} -d ${POSTGRES_DB:-aap}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - aap
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-change-me}
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend,nginx"
      DATABASE_URL: postgres://${POSTGRES_USER:-aap}:${POSTGRES_PASSWORD:-aap}@db:5432/${POSTGRES_DB:-aap}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8090"
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-5d1nde03f6yZvLoRJ4Aoo4xp18YBfAMS6lmY0Eb2OGU=}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      FRONTEND_URL: http://localhost:8090
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: no-reply@aap.local
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aap

  frontend:
    build:
      context: ./frontend
    environment:
      # Absolute, and always through nginx: works whether the page was
      # loaded via nginx (:8090) or the direct dev-server port (:5173).
      VITE_API_URL: http://localhost:8090/api
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - aap

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  aap:
    driver: bridge
